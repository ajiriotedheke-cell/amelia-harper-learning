<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Games | Amelia Harper</title><link rel="stylesheet" href="../styles.css"><style>.catalogue{max-width:1100px;margin:50px auto;padding:0 22px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.game-card{background:white;border:1px solid #eee;border-radius:20px;padding:22px}.game-card .icon{font-size:42px}.game-card h2{font:600 22px Fredoka}.game-card p{font-size:13px;color:#777;line-height:1.6}.tag{font-size:10px;font-weight:800;color:#745cae}.disabled{opacity:.7}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr}}</style></head><body><div class="announcement">PICK A WORLD · FIND YOUR NEXT ADVENTURE</div><main class="catalogue"><a href="../">← Amelia Harper home</a><span class="eyebrow" style="display:block;margin-top:25px">THE GAME LIBRARY</span><h1 style="font:600 44px Fredoka">All adventures</h1><p style="color:#777">Explore games for different ages and stages.</p><div id="cards" class="cards">Loading games…</div></main><script>
(async()=>{const params=new URLSearchParams(location.search),age=params.get('age');const r=await fetch('../game-library.json');const data=await r.json();const games=data.games.filter(g=>!age||g.ageBands.includes(age));document.getElementById('cards').innerHTML=games.map(g=>`<article class="game-card ${g.status!=='published'?'disabled':''}"><div class="icon">${g.icon}</div><span class="tag">${g.category} · Ages ${g.ageBands.join(', ')}</span><h2>${g.title}</h2><p>${g.description}</p>${g.status==='published'?`<a class="btn primary" href="..${g.path}">Play now →</a>`:'<span class="tag">Coming soon</span>'}</article>`).join('')})();
</script></body></html>
